<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Closest & Cheapest</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root{
      --bg:#0f172a; --panel:#121a2c; --muted:#9aa3b2; --border:#1f2937; --text:#e6eef7;
      --accent:#22c55e; --accent-2:#60a5fa; --card:#0b1220; --chip:#0e1a30; --table:#0c1626;
      --btn:#1e293b; --btn-border:#253041; --warn:#f59e0b; --danger:#ef4444;
    }
    body.light{
      --bg:#f6f7fb; --panel:#fff; --muted:#5b6675; --border:#e6e8ee; --text:#0f172a;
      --accent:#16a34a; --accent-2:#3b82f6; --card:#fff; --chip:#eef2ff; --table:#fff;
      --btn:#eef2ff; --btn-border:#dbe2ff;
    }
    *{box-sizing:border-box}
    body{
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      margin:0;
      background:
        radial-gradient(1200px 600px at 15% -10%, #16233f 0%, transparent 60%),
        radial-gradient(1000px 500px at 110% 10%, #132530 0%, transparent 60%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
    }
    .container{max-width:1200px;margin:24px auto 48px;padding:0 16px}
    h1{font-size:clamp(1.4rem,1.1rem+2vw,2.1rem);margin:0 0 14px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.35)}
    .panel{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
    .grow{flex:1 1 auto}
    label.small{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    input,select,button{border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);padding:10px 12px;font-size:15px;outline:none}
    input::placeholder{color:#6b7280}
    button{background:linear-gradient(180deg,var(--btn),#0f172a22);border-color:var(--btn-border);cursor:pointer;transition:transform .08s,box-shadow .15s,background .2s}
    button:hover{box-shadow:0 6px 16px rgba(34,197,94,.25)}
    button:active{transform:translateY(1px)}
    .btn-accent{background:linear-gradient(180deg,var(--accent-2),#2563eb);border-color:#1d4ed8;color:#fff}
    .btn-primary{background:linear-gradient(180deg,var(--accent),#16a34a);border-color:#15803d;color:#fff}
    .btn-ghost{background:transparent;border-color:var(--border)}
    .chip{display:inline-block;padding:3px 8px;border-radius:999px;background:var(--chip);border:1px solid #1b2a45;font-size:12px}
    .muted{color:var(--muted)}
    .warn{color:var(--warn)}
    .danger{color:var(--danger)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}

    #map{height:460px;border-radius:12px;border:1px solid var(--border);background:#0d1324}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:9999}
    .spinner{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:12px;min-width:260px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .spinner:before{content:"";width:18px;height:18px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:56vh}
    table{width:100%;border-collapse:collapse}
    thead th{position:sticky;top:0;background:#0e1a30;color:#cbd5e1;text-align:left;font-weight:700;font-size:13px;padding:10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
    tbody td{padding:10px;border-bottom:1px dashed #1c2434;font-size:14px;background:var(--table)}
    tbody tr:hover{background:#0c1628}
    tr.highlight td{background:#10203a}
    .caret{font-size:12px;margin-left:6px;opacity:.7}

    .drawer{background:var(--panel);border-left:4px solid #1f2937;padding:12px 12px 6px;border-bottom:1px dashed #1c2434}
    .prod-grid{display:grid;grid-template-columns:2.2fr .8fr .7fr;gap:8px;align-items:center}
    .prod-grid div{padding:6px 0;border-bottom:1px dashed #1b2536}
    .prod-header{font-weight:700;color:#9fb3ca}

    /* Picker modal */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:9990}
    .modal-content{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:16px;max-height:84vh;min-width:340px;width:min(760px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .tabs{display:flex;gap:8px;margin-bottom:10px}
    .tab{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer}
    .tab.active{background:linear-gradient(180deg,var(--btn),#0f172a22)}
    #itemList{max-height:56vh;overflow-y:auto;border:1px solid var(--border);background:var(--card);padding:6px;border-radius:8px}
    #itemList label{display:block;padding:6px 4px;cursor:pointer}
    .chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
    .chiplist .chip{display:flex;gap:6px;align-items:center}
    .chip button{border:none;background:#0000;color:inherit;cursor:pointer;font-size:12px}

    /* Topbar secondary */
    .secondary{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    @media (max-width:720px){
      #map{height:280px}
      .toolbar{flex-direction:column;align-items:stretch}
      .secondary{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Find the closest & cheapest store</h1>

  <div class="panel">
    <!-- Primary toolbar -->
    <div class="toolbar">
      <div>
        <label class="small">Latitude</label>
        <input id="lat" type="number" step="any" placeholder="Latitude" style="width:220px">
      </div>
      <div>
        <label class="small">Longitude</label>
        <input id="lon" type="number" step="any" placeholder="Longitude" style="width:220px">
      </div>
      <div>
        <label class="small">Source</label>
        <select id="source" style="width:200px">
          <option value="db">Database</option>
          <option value="kroger">Kroger (live)</option>
        </select>
      </div>
      <div class="spacer"></div>
      <button id="geo" class="btn-accent">Use my location</button>
      <button id="searchBtn" class="btn-primary">Find stores</button>
      <button id="themeToggle" title="Toggle theme">🌙</button>
    </div>

    <!-- Secondary controls -->
    <div class="secondary">
      <div class="row" style="margin:0">
        <button id="selectItemsBtn">Select items</button>
        <div id="selectedItems" class="muted">(none)</div>
      </div>

      <div class="row" style="margin:0">
        <div style="min-width:160px">
          <label class="small">Miles radius</label>
          <input id="radius" type="number" step="1" min="1" value="10" style="width:160px">
        </div>
        <div style="min-width:220px">
          <label class="small">Distance penalty ( $ / mi )</label>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="lambda" type="number" step="0.1" value="0.5" style="width:100px">
            <input id="lambdaRange" type="range" min="0" max="5" step="0.1" value="0.5" style="width:160px">
          </div>
        </div>
        <div style="min-width:180px">
          <label class="small">Sort by</label>
          <select id="sortBy" style="width:180px">
            <option value="score">Score (lowest)</option>
            <option value="total">Total price (lowest)</option>
            <option value="distance">Distance (nearest)</option>
            <option value="found">Items found (highest)</option>
          </select>
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end">
          <button id="shareBtn" class="btn-ghost">Share URL</button>
          <button id="csvBtn" class="btn-ghost">Export CSV</button>
        </div>
      </div>
    </div>

    <div class="muted" style="margin:8px 0 10px">
      <span>Score = <b>total price</b> + λ × <b>distance (mi)</b>. Lower is better.</span>
      <span id="authHint" class="muted" style="margin-left:8px"></span>
    </div>

    <div id="map" class="panel" style="padding:0;box-shadow:none"></div>

    <div id="bestWrap" class="panel" style="display:none;margin-top:12px"></div>

    <div class="row" style="align-items:center">
      <div class="grow">
        <label class="small">Filter results</label>
        <input id="resultFilter" placeholder="Type to filter by store name or city…" style="width:100%">
      </div>
    </div>

    <div class="table-wrap" id="tableWrap" style="display:none">
      <table id="resultTable">
        <thead>
        <tr>
          <th style="width:38px"></th>
          <th data-sort="store">Store</th>
          <th data-sort="distance">Distance</th>
          <th data-sort="total">Total</th>
          <th data-sort="found">Items Found</th>
          <th>Missing</th>
          <th style="width:120px;text-align:right">Actions</th>
        </tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Item Picker Modal -->
<div id="itemModal" class="modal">
  <div class="modal-content">
    <div style="display:flex;align-items:center;gap:10px;justify-content:space-between">
      <h2 style="margin:0 0 10px">Select items</h2>
      <span id="pickerNote" class="muted" style="font-size:12px"></span>
    </div>

    <div class="tabs">
      <button id="tabDb" class="tab">From Database</button>
      <button id="tabFree" class="tab">Type keywords</button>
    </div>

    <!-- DB list -->
    <div id="dbPane">
      <input id="itemSearch" placeholder="Search DB items..." style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:10px;">
      <div id="itemList"></div>
    </div>

    <!-- Free keywords (Kroger-friendly) -->
    <div id="freePane" style="display:none">
      <div class="muted" style="margin-bottom:6px">Type an item and press Enter. Examples: <i>2% milk</i>, <i>white bread</i>, <i>bananas</i>.</div>
      <input id="freeInput" placeholder="Type item and press Enter…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:8px;">
      <div id="freeChips" class="chiplist"></div>
    </div>

    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button id="cancelSelect">Cancel</button>
      <button id="confirmSelect" class="btn-accent">Use selected</button>
    </div>
  </div>
</div>

<!-- Searching overlay -->
<div id="overlay" class="overlay">
  <div class="spinner"><div></div><div>Searching nearby stores…</div></div>
</div>

<script>
  const apiBase = window.location.origin;

  // === Theme ===
  const themeToggle = document.getElementById('themeToggle');
  function applyTheme(){
    const t = localStorage.getItem('theme') || 'dark';
    document.body.classList.toggle('light', t === 'light');
    themeToggle.textContent = t === 'light' ? '🌞' : '🌙';
  }
  themeToggle.onclick = ()=>{
    const t = localStorage.getItem('theme') || 'dark';
    localStorage.setItem('theme', t === 'light' ? 'dark' : 'light');
    applyTheme();
  };
  applyTheme();

  // === State / DOM refs ===
  const $lat = document.getElementById('lat');
  const $lon = document.getElementById('lon');
  const $radius = document.getElementById('radius');
  const $lambda = document.getElementById('lambda');
  const $lambdaRange = document.getElementById('lambdaRange');
  const $overlay = document.getElementById('overlay');
  const $resultFilter = document.getElementById('resultFilter');
  const $tableWrap = document.getElementById('tableWrap');
  const $tbody = document.getElementById('resultBody');
  const $bestWrap = document.getElementById('bestWrap');
  const $source = document.getElementById('source');
  const $sortBy = document.getElementById('sortBy');
  const $authHint = document.getElementById('authHint');

  // item picker
  const selectBtn = document.getElementById('selectItemsBtn');
  const modal = document.getElementById('itemModal');
  const itemListEl = document.getElementById('itemList');
  const selectedItemsEl = document.getElementById('selectedItems');
  const itemSearch = document.getElementById('itemSearch');
  const cancelBtn = document.getElementById('cancelSelect');
  const confirmBtn = document.getElementById('confirmSelect');
  const tabDb = document.getElementById('tabDb');
  const tabFree = document.getElementById('tabFree');
  const dbPane = document.getElementById('dbPane');
  const freePane = document.getElementById('freePane');
  const freeInput = document.getElementById('freeInput');
  const freeChips = document.getElementById('freeChips');
  const pickerNote = document.getElementById('pickerNote');

  let allItems = [];
  let selectedSet = new Set();      // display names/chips
  let freeSet = new Set();          // for "Type keywords" tab

  // === Helpers ===
  const fmtMoney = (n)=> `$${(n||0).toFixed(2)}`;

  function showSelectedItems(){
    const both = new Set([...selectedSet, ...freeSet]);
    const text = [...both].join(', ');
    selectedItemsEl.textContent = text || '(none)';
  }
  function selectedItemsCSV(){
    const both = new Set([...selectedSet, ...freeSet]);
    return [...both].join(',');
  }

  // load/save prefs
  function loadPrefs(){
    $lat.value = localStorage.getItem('lat') || '';
    $lon.value = localStorage.getItem('lon') || '';
    $radius.value = localStorage.getItem('radius') || 10;
    $lambda.value = localStorage.getItem('lambda') || 0.5;
    $lambdaRange.value = $lambda.value;
    $source.value = localStorage.getItem('source') || 'db';
    const savedSel = JSON.parse(localStorage.getItem('selectedItems') || '[]');
    const savedFree = JSON.parse(localStorage.getItem('freeItems') || '[]');
    selectedSet = new Set(savedSel);
    freeSet = new Set(savedFree);
    showSelectedItems();
    updatePickerTabs();
  }
  function savePrefs(lat, lon, radius){
    localStorage.setItem('lat', lat);
    localStorage.setItem('lon', lon);
    localStorage.setItem('radius', radius);
    localStorage.setItem('lambda', $lambda.value);
    localStorage.setItem('source', $source.value);
    localStorage.setItem('selectedItems', JSON.stringify([...selectedSet]));
    localStorage.setItem('freeItems', JSON.stringify([...freeSet]));
  }
  loadPrefs();

  // lambda sync
  function syncLambda(fromRange){
    if (fromRange) $lambda.value = $lambdaRange.value;
    else $lambdaRange.value = $lambda.value || 0.5;
    localStorage.setItem('lambda', $lambda.value);
  }
  $lambda.oninput = ()=>syncLambda(false);
  $lambdaRange.oninput = ()=>syncLambda(true);

  // === Map ===
  let map=null, markerGroup=null, radiusCircle=null;
  let currentMarkersById = new Map();

  function ensureMap(lat, lon){
    if (!map){
      map = L.map('map').setView([lat, lon], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
      markerGroup = L.layerGroup().addTo(map);
    } else {
      map.setView([lat, lon], 12);
      markerGroup.clearLayers();
      currentMarkersById.clear();
    }
    L.marker([lat, lon], {title:'You'}).addTo(markerGroup).bindPopup('<b>Your location</b>').openPopup();
  }
  function drawRadius(lat, lon, miles){
    const meters = miles * 1609.34;
    if (radiusCircle){
      radiusCircle.setLatLng([lat,lon]).setRadius(meters);
    } else {
      radiusCircle = L.circle([lat,lon], { radius: meters, color:'#22c55e', weight:1, fillColor:'#22c55e', fillOpacity:.08 });
      radiusCircle.addTo(markerGroup);
    }
  }

  // geolocation
  document.getElementById('geo').onclick = ()=>{
    if (!navigator.geolocation){
      alert('Geolocation not supported.');
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos=>{
        const lat=+pos.coords.latitude.toFixed(6), lon=+pos.coords.longitude.toFixed(6);
        $lat.value=lat; $lon.value=lon;
        ensureMap(lat, lon);
        drawRadius(lat, lon, +$radius.value || 10);
      },
      err=>{
        console.warn('Geolocation error:', err.message);
        alert(err.message + '\nTip: allow location access or enter lat/lon manually.');
      }, { enableHighAccuracy:true, timeout:8000 }
    );
  };

  // === Item picker ===
  function updatePickerTabs(){
    const src = $source.value;
    // default to DB list in DB mode; allow both tabs in either mode
    pickerNote.textContent = src==='kroger'
      ? 'Kroger mode: keywords help match brands/sizes (e.g., “2% milk 1gal”).'
      : 'Database mode: items come from your DB.';
  }
  $source.addEventListener('change', updatePickerTabs);

  async function loadDbItems(q=''){
    const url = new URL('/api/items', window.location.origin);
    if (q) url.searchParams.set('q', q);
    try{
      const res = await fetch(url);
      const arr = await res.json();
      allItems = Array.isArray(arr)?arr:[];
    }catch{ allItems = []; }
    renderDbItemList();
  }
  function renderDbItemList(){
    itemListEl.innerHTML = '';
    if (!allItems.length){ itemListEl.innerHTML = '<div class="muted" style="padding:8px">No items found.</div>'; return; }
    allItems.forEach(name=>{
      const id = `chk_${name.replace(/\s+/g,'_')}`;
      const row = document.createElement('div');
      row.innerHTML = `<label><input type="checkbox" id="${id}" value="${name}" ${selectedSet.has(name)?'checked':''}> ${name}</label>`;
      row.querySelector('input').addEventListener('change', e=>{
        if (e.target.checked) selectedSet.add(name); else selectedSet.delete(name);
      });
      itemListEl.appendChild(row);
    });
  }
  function renderFreeChips(){
    freeChips.innerHTML='';
    [...freeSet].forEach(v=>{
      const el = document.createElement('span');
      el.className='chip';
      el.innerHTML = `${v} <button title="remove" aria-label="remove">✕</button>`;
      el.querySelector('button').onclick = ()=>{ freeSet.delete(v); renderFreeChips(); };
      freeChips.appendChild(el);
    });
  }

  selectBtn.onclick = async ()=>{
    modal.style.display='flex';
    // start on a sensible tab
    if ($source.value==='kroger'){ activateTab('free'); } else { activateTab('db'); }
    await loadDbItems();
    itemSearch.value=''; itemSearch.focus();
    renderFreeChips();
  };
  cancelBtn.onclick = ()=>{ modal.style.display='none'; };
  confirmBtn.onclick = ()=>{
    modal.style.display='none';
    showSelectedItems();
    localStorage.setItem('selectedItems', JSON.stringify([...selectedSet]));
    localStorage.setItem('freeItems', JSON.stringify([...freeSet]));
  };
  itemSearch.addEventListener('input', ()=>{
    const q = itemSearch.value.trim();
    clearTimeout(window._itemSearchTimer);
    window._itemSearchTimer = setTimeout(()=>loadDbItems(q), 250);
  });
  freeInput.addEventListener('keydown', (e)=>{
    if (e.key==='Enter'){
      const val = freeInput.value.trim();
      if (val){ freeSet.add(val); renderFreeChips(); freeInput.value=''; }
    }
  });
  function activateTab(which){
    if (which==='db'){
      tabDb.classList.add('active'); tabFree.classList.remove('active');
      dbPane.style.display='block'; freePane.style.display='none';
    }else{
      tabFree.classList.add('active'); tabDb.classList.remove('active');
      dbPane.style.display='none'; freePane.style.display='block';
      freeInput.focus();
    }
  }
  tabDb.onclick = ()=>activateTab('db');
  tabFree.onclick = ()=>activateTab('free');

  // === Search ===
  document.getElementById('searchBtn').onclick = doSearch;

  async function doSearch(){
    const latStr = $lat.value.trim(), lonStr = $lon.value.trim();
    if (!latStr || !lonStr) return alert("Provide lat/lon (or click 'Use my location').");
    const lat = parseFloat(latStr), lon = parseFloat(lonStr);

    if (!map) ensureMap(lat, lon);
    drawRadius(lat, lon, parseFloat($radius.value||'10'));
    savePrefs(lat, lon, $radius.value||'10');

    const items = selectedItemsCSV();
    const url = new URL(apiBase + '/api/search');
    url.searchParams.set('lat', lat);
    url.searchParams.set('lon', lon);
    if (items) url.searchParams.set('items', items);
    url.searchParams.set('radius_miles', $radius.value || '10');
    url.searchParams.set('lambda_per_mile', $lambda.value || '0.5');
    url.searchParams.set('source', $source.value); // <— DB or kroger

    setLoading(true);
    try{
      const res = await fetch(url);
      const data = await res.json();
      render(data);
    }catch(e){
      console.error(e);
      alert('Search failed. See console for details.');
    }finally{
      setLoading(false);
    }
  }

  function setLoading(b){
    document.getElementById('searchBtn').disabled = b;
    document.getElementById('geo').disabled = b;
    $overlay.style.display = b ? 'flex' : 'none';
  }

  // === Render ===
  let lastResults = {rows:[], best:null, source:'db'};
  let comparing = [];
  let currentSort = 'score';

  function render(data){
    if (data.error){
      $bestWrap.style.display='block';
      $bestWrap.innerHTML = `<div class="panel danger">Error: ${data.error}</div>`;
      $tableWrap.style.display='none';
      return;
    }

    const rows = (data.stores_full||[]).concat(data.stores_partial||[]);
    lastResults = {rows, best:data.best||null, source: ($source.value||'db')};

    // auth hint (optional)
    fetchKrogerAuthStatus();

    // apply client-side sort
    sortRows(rows, $sortBy.value);

    renderBest(data.best);
    renderTable(rows, data.best ? data.best.store_id : null);

    // map markers
    if (map && markerGroup){
      markerGroup.clearLayers();
      currentMarkersById.clear();
      const lat = parseFloat($lat.value), lon = parseFloat($lon.value);
      L.marker([lat, lon], {title:'You'}).addTo(markerGroup).bindPopup('<b>Your location</b>');
      drawRadius(lat, lon, +$radius.value || 10);

      if (rows.length){
        const bounds = L.latLngBounds();
        rows.forEach(s=>{
          const m = L.marker([s.lat, s.lon], {title:s.store_name}).addTo(markerGroup);
          m.bindPopup(`<b>${s.store_name}</b><br>${s.distance_miles.toFixed(2)} mi<br>${fmtMoney(s.total_price||0)}`);
          if (data.best && s.store_id === data.best.store_id) m.setZIndexOffset(1000);
          currentMarkersById.set(s.store_id, m);
          bounds.extend(m.getLatLng());
          m.on('mouseover',()=>highlightRow(s.store_id,true));
          m.on('mouseout',()=>highlightRow(s.store_id,false));
          m.on('click',()=>scrollToRow(s.store_id));
        });
        markerGroup.eachLayer(l=>bounds.extend(l.getLatLng())); // include user pin
        map.fitBounds(bounds, {padding:[50,50]});
      }
    }
  }

  function sortRows(rows, key){
    if (key==='score') rows.sort((a,b)=>(a.score??1e9)-(b.score??1e9));
    else if (key==='total') rows.sort((a,b)=>(a.total_price??1e9)-(b.total_price??1e9));
    else if (key==='distance') rows.sort((a,b)=>a.distance_miles-b.distance_miles);
    else if (key==='found') rows.sort((a,b)=> (b.items_found||0) - (a.items_found||0));
  }
  $sortBy.addEventListener('change', ()=>{ if (lastResults.rows.length){ sortRows(lastResults.rows, $sortBy.value); renderTable(lastResults.rows, lastResults.best?.store_id); }});

  function renderBest(best){
    if (!best){ $bestWrap.style.display='none'; return; }
    $bestWrap.style.display='block';
    const missing = Array.isArray(best.items_missing) && best.items_missing.length ? `<div class="muted" style="margin-top:6px">Missing: ${best.items_missing.join(', ')}</div>` : '';
    $bestWrap.innerHTML = `
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <h3 style="margin:0">${best.store_name}</h3>
        <span class="chip"><b>${best.distance_miles.toFixed(2)} mi</b></span>
        <span class="chip"><b>${fmtMoney(best.total_price||0)}</b></span>
        <span class="chip"><b>${(best.score??0).toFixed(2)}</b> score</span>
        ${lastResults.source==='kroger' ? '<span class="chip">Kroger</span>' : '<span class="chip">DB</span>'}
      </div>
      ${missing}`;
  }

  function rowDetailsHtml(s){
    // Prefer Kroger detailed products if present
    const list = s.kroger_products || s.items_detail || null;
    if (!list) return `<div class="muted">No per-item details available.</div>`;

    // Normalize to array of { name/brand/size, price }
    // Possible shapes:
    // - kroger_products: [{token, items:[{brand,size,price,name,upc,productId}...]}]
    // - items_detail:    [{name, brand, size, price}]
    let rows = [];
    if (s.kroger_products){
      s.kroger_products.forEach(group=>{
        if (group.items && group.items.length){
          // choose cheapest first; but display top 3 options
          const top = [...group.items].sort((a,b)=>(+a.price)-(+b.price)).slice(0,3);
          top.forEach((it,idx)=>{
            rows.push({
              name: it.name || group.token,
              brand: it.brand || '',
              size: it.size || '',
              price: +it.price || 0,
              upc: it.upc || '',
              rank: idx+1
            });
          });
        }else{
          rows.push({name: group.token, brand:'', size:'', price:0, upc:'', rank:null});
        }
      });
    } else if (s.items_detail){
      rows = s.items_detail.map(it=>({name:it.name||'', brand:it.brand||'', size:it.size||'', price:+(it.price||0), upc:it.upc||''}));
    }

    if (!rows.length) return `<div class="muted">No per-item details available.</div>`;

    const header = `<div class="prod-grid prod-header"><div>Item (brand/size)</div><div style="text-align:right">Best price</div><div style="text-align:right">Option</div></div>`;
    const html = rows.map(r=>`
      <div class="prod-grid">
        <div>${r.name}${r.brand?` <span class="muted">· ${r.brand}</span>`:''}${r.size?` <span class="muted">· ${r.size}</span>`:''}${r.upc?` <span class="muted">· UPC ${r.upc}</span>`:''}</div>
        <div style="text-align:right">${r.price>0?fmtMoney(r.price):'<span class="muted">—</span>'}</div>
        <div style="text-align:right">${r.rank?('#'+r.rank):''}</div>
      </div>`).join('');

    return header + html;
  }

  function renderTable(rows, bestId){
    $tbody.innerHTML = '';
    rows.forEach(s=>{
      const tr = document.createElement('tr');
      tr.dataset.sid = s.store_id;
      const missingTxt = (s.items_missing||[]).join(', ');
      tr.innerHTML = `
        <td><input type="checkbox" class="cmp" data-sid="${s.store_id}"></td>
        <td class="rowHead" style="cursor:pointer">${s.store_name}${s.city?` <span class="muted">· ${s.city}</span>`:''} <span class="caret">▾</span></td>
        <td>${s.distance_miles.toFixed(2)} mi</td>
        <td>${fmtMoney(s.total_price||0)}</td>
        <td><span class="chip">${s.items_found||0}</span></td>
        <td>${missingTxt}</td>
        <td style="text-align:right">
          ${lastResults.source==='kroger'
            ? '<button class="btn-ghost small addCartBtn" data-sid="'+s.store_id+'">Add to cart</button>'
            : '<span class="muted">—</span>'}
        </td>`;
      if (s.store_id === bestId) tr.classList.add('highlight');
      $tbody.appendChild(tr);

      // Drawer row
      const drawer = document.createElement('tr');
      drawer.innerHTML = `<td></td><td colspan="6"><div class="drawer" style="display:none"></div></td>`;
      $tbody.appendChild(drawer);

      // Interactions
      tr.querySelector('.rowHead').addEventListener('click', ()=>{
        const el = drawer.querySelector('.drawer');
        const open = el.style.display !== 'none';
        if (open){ el.style.display='none'; tr.querySelector('.caret').textContent='▾'; return; }
        el.innerHTML = rowDetailsHtml(s);
        el.style.display='block';
        tr.querySelector('.caret').textContent='▴';
        const m=currentMarkersById.get(s.store_id); if (m){ m.openPopup(); }
      });

      tr.addEventListener('mouseenter',()=>{ const m=currentMarkersById.get(s.store_id); if (m) m.openPopup(); highlightRow(s.store_id,true); });
      tr.addEventListener('mouseleave',()=>highlightRow(s.store_id,false));
    });

    $tableWrap.style.display = rows.length ? 'block' : 'none';
    wireCompareCheckboxes();
    wireCartButtons();
  }

  function highlightRow(sid, on){
    const row = $tbody.querySelector(`tr[data-sid="${sid}"]`);
    if (row) row.classList.toggle('highlight', on);
  }
  function scrollToRow(sid){
    const row = $tbody.querySelector(`tr[data-sid="${sid}"]`);
    if (!row) return;
    row.scrollIntoView({behavior:'smooth', block:'center'});
    row.classList.add('highlight');
    setTimeout(()=>row.classList.remove('highlight'), 1200);
  }

  // instant filter
  $resultFilter.addEventListener('input', ()=>{
    const q = $resultFilter.value.trim().toLowerCase();
    for (const tr of $tbody.querySelectorAll('tr')){
      // skip drawer rows
      if (!tr.dataset.sid) continue;
      tr.style.display = tr.innerText.toLowerCase().includes(q) ? '' : 'none';
      const drawer = tr.nextElementSibling;
      if (drawer && !tr.style.display) drawer.style.display = 'none';
    }
  });

  // compare two stores
  function wireCompareCheckboxes(){
    comparing = [];
    document.querySelectorAll('.cmp').forEach(cb=>{
      cb.addEventListener('change', e=>{
        const sid = parseInt(e.target.dataset.sid, 10);
        const store = lastResults.rows.find(r=>r.store_id === sid);
        if (!store) return;
        if (e.target.checked){
          if (comparing.length >= 2){
            const first = document.querySelector(`.cmp[data-sid="${comparing[0].store_id}"]`);
            if (first) first.checked = false;
            comparing.shift();
          }
          comparing.push(store);
        } else {
          comparing = comparing.filter(s=>s.store_id !== sid);
        }
        // simple highlight both
        document.querySelectorAll('tr').forEach(tr=>tr.classList.remove('compare'));
        comparing.forEach(s=>{
          const tr = $tbody.querySelector(`tr[data-sid="${s.store_id}"]`);
          if (tr) tr.classList.add('compare');
        });
      });
    });
  }

  // === Kroger auth/cart (optional; safe if backend lacks endpoints) ===
  async function fetchKrogerAuthStatus(){
    try{
      const r = await fetch('/api/kroger/status');
      if (!r.ok) return;
      const j = await r.json();
      if (j && j.authorized){
        $authHint.innerHTML = '<span class="chip">Kroger: signed in</span>';
      } else {
        $authHint.innerHTML = lastResults.source==='kroger'
          ? '<a href="/api/kroger/login" class="chip" style="text-decoration:none">Sign in to Kroger for cart</a>'
          : '';
      }
    }catch{ /* ignore */ }
  }
  function wireCartButtons(){
    document.querySelectorAll('.addCartBtn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const sid = parseInt(btn.dataset.sid, 10);
        const store = lastResults.rows.find(r=>r.store_id===sid);
        if (!store) return;
        try{
          const req = {
            store_id: sid,
            items: (store.kroger_products||[]).flatMap(g=>{
              if (!g.items || !g.items.length) return [];
              // choose the cheapest option per token
              const best = [...g.items].sort((a,b)=>(+a.price)-(+b.price))[0];
              return best && best.productId ? [{productId: best.productId, qty: 1}] : [];
            })
          };
          if (!req.items.length){ alert('No Kroger-matched items to add.'); return; }
          const r = await fetch('/api/kroger/cart', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(req)});
          const j = await r.json().catch(()=>({}));
          if (r.ok){ alert('Added to Kroger cart!'); }
          else { alert('Cart error: ' + (j.error||r.statusText)); }
        }catch(e){ alert('Cart error: ' + e); }
      });
    });
  }

  // === Share URL & CSV ===
  document.getElementById('shareBtn').onclick = ()=>{
    const u = new URL(location.href);
    u.searchParams.set('lat', $lat.value);
    u.searchParams.set('lon', $lon.value);
    u.searchParams.set('radius', $radius.value);
    u.searchParams.set('lambda', $lambda.value);
    u.searchParams.set('source', $source.value);
    u.searchParams.set('items', selectedItemsCSV());
    navigator.clipboard.writeText(u.toString()).then(()=>alert('URL copied to clipboard'));
  };

  document.getElementById('csvBtn').onclick = ()=>{
    if (!lastResults.rows.length){ alert('Run a search first.'); return; }
    const lines = [['Store','Distance (mi)','Total ($)','Items Found','Missing']].concat(
      lastResults.rows.map(s=>[
        s.store_name,
        s.distance_miles.toFixed(2),
        (s.total_price||0).toFixed(2),
        s.items_found||0,
        (s.items_missing||[]).join(' ')
      ])
    );
    const csv = lines.map(r=>r.map(x=>String(x).replace(/"/g,'""')).map(x=>`"${x}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'closest-cheapest.csv';
    a.click();
  };

  // init map from saved coords
  (function init(){
    const lat = parseFloat($lat.value), lon = parseFloat($lon.value);
    if (!isNaN(lat) && !isNaN(lon)){ ensureMap(lat, lon); drawRadius(lat, lon, +$radius.value || 10); }
  })();
</script>
</body>
</html>
