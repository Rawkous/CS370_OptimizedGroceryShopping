<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrocoLoco</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      overflow: hidden;
      color: white;
      font-family: system-ui, sans-serif;
    }

    #logo {
      opacity: 0;
      transform: scale(0.8);
      animation: fadeIn 2s ease forwards;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    #buttons {
      margin-top: 40px;
      display: none;
      animation: fadeUp 1s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    button {
      margin: 10px;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <img id="logo" src="{{ url_for('static', filename='images/grocoloco_logo.png') }}" width="180" alt="GrocoLoco Logo">
  <div id="buttons">
    <button onclick="location.href='/page2'">Login</button>
    <button onclick="location.href='/page2'">Browse</button>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('buttons').style.display = 'block';
    }, 2200);
  </script>
</body>
</html>
